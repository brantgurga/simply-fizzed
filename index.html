<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
        background-color: %BACKGROUND_LIGHT%;
        color: %TEXT_LIGHT%;
      }

      body {
        margin: 0;
      }

      #root {
        min-height: 100vh;
      }

      .startup-shell {
        box-sizing: border-box;
        display: grid;
        min-height: inherit;
        padding: 24px;
        place-items: center;
        text-align: center;
      }

      .startup-shell__name {
        font-family: Roboto, Arial, sans-serif;
        font-size: 3rem;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.167;
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background-color: %BACKGROUND_DARK%;
          color: %TEXT_DARK%;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="%BRAND_FAVICON%" />
    <link rel="apple-touch-icon" href="%BRAND_APPLE_TOUCH_ICON%" />
    <link
      rel="preload"
      href="/node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_NAME%</title>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell">
        <h1 class="startup-shell__name">%BRAND_NAME%</h1>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
