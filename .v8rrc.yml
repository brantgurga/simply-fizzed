# v8r configuration: validate config files against vendored JSON Schemas.
# Docs: https://chris48s.github.io/v8r/configuration/
#
# Every matched file maps to a local schema so validation does not depend on
# SchemaStore or another schema host being available. The vendored files retain
# their upstream names under .v8r/schemas to make future refreshes traceable.
# SchemaStore files are Apache-2.0 and the Firebase schema is MIT; the upstream
# license and notice files are preserved in the same directory.
# Structural/duplicate-key linting of JSON/JSONC remains Biome's responsibility.
patterns:
  - package.json
  - firebase.json
  - tsconfig*.json
  - .github/dependabot.yml

customCatalog:
  schemas:
    # Source: https://www.schemastore.org/package.json
    # Its transitive SchemaStore references are vendored alongside it; the root
    # and ESLint schema IDs are omitted so relative refs resolve to local files.
    - name: package.json
      fileMatch:
        - package.json
      location: .v8r/schemas/package.json

    # Source: https://raw.githubusercontent.com/firebase/firebase-tools/master/schema/firebase-config.json
    - name: Firebase configuration
      fileMatch:
        - firebase.json
      location: .v8r/schemas/firebase-config.json

    # Source: https://www.schemastore.org/dependabot-2.0.json
    - name: Dependabot v2 configuration
      fileMatch:
        - .github/dependabot.yml
      location: .v8r/schemas/dependabot-2.0.json

    # Source: https://www.schemastore.org/tsconfig.json
    # TypeScript configuration files allow JSONC comments, so parse them with
    # json5 instead of the strict parser inferred from their .json extension.
    - name: TSConfig
      fileMatch:
        - tsconfig.json
        - tsconfig.*.json
      location: .v8r/schemas/tsconfig.json
      parser: json5
