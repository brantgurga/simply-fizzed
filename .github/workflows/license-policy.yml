name: License policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Notices & assignment
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate changed files and contributor assignment
        uses: actions/github-script@v8
        with:
          script: |
            const policy = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/license-policy.js`);
            await policy.validatePullRequest({ github, context, core });
