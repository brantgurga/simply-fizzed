name: License policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Notices & assignment
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the trusted default branch by default.
      # Never select the pull request head or execute contributor-controlled code here.
      - name: Check out trusted default-branch policy code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate changed files and contributor assignment
        uses: actions/github-script@v9
        with:
          script: |
            const policy = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/license-policy.js`);
            await policy.validatePullRequest({ github, context, core });
