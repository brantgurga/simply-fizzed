name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `npm ci` triggers the `prepare` script (husky); skip hook installation in CI.
  HUSKY: 0

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint (type-aware)
        run: npm run lint:types

      - name: Check formatting
        run: npm run fmt:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore security rules
        run: npm run test:rules

  lint-docs:
    name: Lint Markdown, YAML & JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # markdownlint-cli2 is a lint-only tool run via npx (pinned for
      # reproducibility), so it is not added to package.json dependencies.
      # It reads globs and rules from .markdownlint-cli2.jsonc.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2

      # Biome lints JSON/JSONC (duplicate keys, syntax) via npx (pinned). Its
      # formatter is disabled in biome.json so it never conflicts with oxfmt;
      # scope and rules come from biome.json. oxlint does not lint JSON yet.
      - name: Lint JSON/JSONC
        run: npx --yes @biomejs/biome@2.5.14 lint

      # v8r validates config files against vendored JSON Schemas, avoiding
      # network lookups; the file list and local mappings come from .v8rrc.yml.
      - name: Validate JSON Schemas
        run: npx --yes v8r@6.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # yamllint is a Python tool; install it directly (pinned) rather than
      # adding a Node dependency. It reads rules from .yamllint.yml.
      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Lint YAML
        run: yamllint .

      # actionlint checks GitHub Actions semantics and embedded shell scripts.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      # Match the hermetic browser path used in playwright.config.ts so the
      # install step and the test run resolve the same binaries.
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # The Firestore emulator (seeded before the tests) runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # The Playwright webServer builds the app and serves it via the Firebase
      # Hosting emulator while also running the Firestore emulator, which the
      # globalSetup seeds with fixtures. Everything targets the offline demo
      # project, so no Firebase credentials are involved.
      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
