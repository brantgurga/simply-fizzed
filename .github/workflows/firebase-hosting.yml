name: Firebase Hosting CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging workflow run ID to promote
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  HUSKY: 0

jobs:
  deploy-staging:
    name: Deploy staging channel
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: simply-fizzed-prod.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: simply-fizzed-prod
      VITE_FIREBASE_STORAGE_BUCKET: simply-fizzed-prod.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "562151439154"
      VITE_FIREBASE_APP_ID: "1:562151439154:web:9216391ad8dd574951352b"
      VITE_FIREBASE_MEASUREMENT_ID: G-TYWXP7PBJG
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production client configuration
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || {
            echo "::error::Set the VITE_FIREBASE_API_KEY repository variable"
            exit 1
          }
          test -n "$VITE_GOOGLE_MAPS_API_KEY" || {
            echo "::error::Set the VITE_GOOGLE_MAPS_API_KEY repository variable"
            exit 1
          }

      - name: Build production artifact
        run: npm run build

      - name: Save production artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebase-hosting
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Deploy staging channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: simply-fizzed-prod
          channelId: staging-${{ github.run_id }}
          expires: 30d
          firebaseToolsVersion: 15.30.0

      - name: Summarize staging deployment
        env:
          STAGING_URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          {
            echo "## Firebase staging deployment"
            echo "- URL: $STAGING_URL"
            echo "- Run ID to approve for production: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    name: Promote approved staging artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify staging run
        id: verify
        uses: actions/github-script@v8
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        with:
          result-encoding: string
          script: |
            const runId = Number(process.env.STAGING_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("The staging run ID must be a positive integer.");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const approved =
              run.name === "Firebase Hosting CD" &&
              run.event === "workflow_run" &&
              run.head_branch === "main" &&
              run.conclusion === "success";
            if (!approved) {
              core.setFailed("Choose a successful main-branch Firebase Hosting CD staging run.");
              return;
            }
            return run.head_sha;

      - name: Checkout approved configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verify.outputs.result }}

      - name: Download approved artifact
        uses: actions/download-artifact@v7
        with:
          name: firebase-hosting
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Deploy live channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: simply-fizzed-prod
          channelId: live
          firebaseToolsVersion: 15.30.0

      - name: Summarize production deployment
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          {
            echo "## Firebase production deployment"
            echo "- URL: $PRODUCTION_URL"
            echo "- Promoted staging run: ${{ inputs.staging_run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
