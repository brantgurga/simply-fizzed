name: Firebase Hosting CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging workflow run ID to promote
        required: true
        type: string

permissions:
  actions: read
  contents: read

# The fixed staging channel is mutable, so staging deploys and promotions must
# not overlap.
concurrency:
  group: firebase-hosting-delivery
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  build-staging:
    name: Build staging artifact
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: simply-fizzed-prod.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: simply-fizzed-prod
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      VITE_FIREBASE_STORAGE_BUCKET: simply-fizzed-prod.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "562151439154"
      VITE_FIREBASE_APP_ID: "1:562151439154:web:9216391ad8dd574951352b"
      VITE_FIREBASE_MEASUREMENT_ID: G-TYWXP7PBJG
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Validate production client configuration
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || {
            echo "::error::Set the VITE_FIREBASE_API_KEY production environment variable"
            exit 1
          }
          test -n "$VITE_FIREBASE_APPCHECK_SITE_KEY" || {
            echo "::error::Set the VITE_FIREBASE_APPCHECK_SITE_KEY production environment variable"
            exit 1
          }
          test -n "$VITE_GOOGLE_MAPS_API_KEY" || {
            echo "::error::Set the VITE_GOOGLE_MAPS_API_KEY production environment variable"
            exit 1
          }

      - name: Build production artifact
        run: npm run build

      - name: Save production artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebase-hosting
          path: |
            dist/
            firebase.json
            firestore.indexes.json
            firestore.rules
            functions/lib/
            functions/src/
            functions/package.json
            functions/package-lock.json
            functions/tsconfig.json
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy staging channel
    needs: build-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download production artifact
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting

      - name: Install deployment dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Validate Functions deployment configuration
        env:
          OPERATOR_UIDS_JSON: ${{ vars.FIREBASE_OPERATOR_UIDS_JSON }}
          ENFORCE_APP_CHECK: ${{ vars.FIREBASE_ENFORCE_FUNCTIONS_APP_CHECK }}
          GET_MY_AUTHORIZATION_SERVICE_ACCOUNT: ${{ vars.FIREBASE_GET_MY_AUTHORIZATION_SERVICE_ACCOUNT }}
          SEARCH_USERS_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SEARCH_USERS_SERVICE_ACCOUNT }}
          REVEAL_USER_EMAIL_SERVICE_ACCOUNT: ${{ vars.FIREBASE_REVEAL_USER_EMAIL_SERVICE_ACCOUNT }}
          APPLY_USER_MANAGEMENT_SERVICE_ACCOUNT: ${{ vars.FIREBASE_APPLY_USER_MANAGEMENT_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const raw = process.env.OPERATOR_UIDS_JSON ?? "";
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            parsed = undefined;
          }
          const structurallyValid =
            Array.isArray(parsed) &&
            parsed.length > 0 &&
            parsed.every(
              (uid) =>
                typeof uid === "string" &&
                uid.length >= 1 &&
                uid.length <= 128 &&
                uid.trim() === uid,
            ) &&
            new Set(parsed).size === parsed.length;
          if (!structurallyValid) {
            console.error("::error::Set FIREBASE_OPERATOR_UIDS_JSON to unique Auth UIDs");
            process.exit(1);
          }
          const enforceAppCheck = (process.env.ENFORCE_APP_CHECK || "false").toLowerCase();
          if (enforceAppCheck !== "true" && enforceAppCheck !== "false") {
            console.error("::error::FIREBASE_ENFORCE_FUNCTIONS_APP_CHECK must be true or false");
            process.exit(1);
          }
          const serviceAccounts = [
            ["GET_MY_AUTHORIZATION_SERVICE_ACCOUNT", process.env.GET_MY_AUTHORIZATION_SERVICE_ACCOUNT],
            ["SEARCH_USERS_SERVICE_ACCOUNT", process.env.SEARCH_USERS_SERVICE_ACCOUNT],
            ["REVEAL_USER_EMAIL_SERVICE_ACCOUNT", process.env.REVEAL_USER_EMAIL_SERVICE_ACCOUNT],
            ["APPLY_USER_MANAGEMENT_SERVICE_ACCOUNT", process.env.APPLY_USER_MANAGEMENT_SERVICE_ACCOUNT],
          ];
          const serviceAccountPattern = /^[^@\s]+@simply-fizzed-prod\.iam\.gserviceaccount\.com$/;
          for (const [name, value = ""] of serviceAccounts) {
            if (!serviceAccountPattern.test(value)) {
              console.error(`::error::Set FIREBASE_${name} for simply-fizzed-prod`);
              process.exit(1);
            }
          }
          if (new Set(serviceAccounts.map(([, value]) => value)).size !== serviceAccounts.length) {
            console.error("::error::Each Function requires a distinct runtime service account");
            process.exit(1);
          }
          fs.writeFileSync(
            "functions/.env.simply-fizzed-prod",
            `OPERATOR_UIDS_JSON=${JSON.stringify(raw)}\n` +
              `ENFORCE_APP_CHECK=${enforceAppCheck}\n` +
              serviceAccounts
                .map(([name, value]) => `${name}=${JSON.stringify(value)}\n`)
                .join(""),
            { mode: 0o600 },
          );
          NODE

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: simply-fizzed-prod
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@simply-fizzed-prod.iam.gserviceaccount.com

      - name: Deploy Functions, Firestore rules, and indexes
        run: >-
          npx --no-install firebase deploy
          --only functions,firestore:rules,firestore:indexes
          --project simply-fizzed-prod --non-interactive

      - name: Deploy staging channel
        id: deploy
        env:
          CHANNEL_ID: staging
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/firebase-hosting-staging.json"
          npx --no-install firebase hosting:channel:deploy "$CHANNEL_ID" \
            --project simply-fizzed-prod \
            --expires 30d \
            --non-interactive \
            --json | tee "$output"
          url="$(
            node --input-type=module -e '
              import fs from "node:fs";
              const { result } = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const deployment = Object.values(result)[0];
              if (!deployment?.url) process.exit(1);
              process.stdout.write(deployment.url);
            ' "$output"
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarize staging deployment
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Firebase staging deployment"
            echo "- URL: $STAGING_URL"
            echo "- Run ID to approve for production: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    name: Promote approved staging artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify staging run
        id: verify
        uses: actions/github-script@v9
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        with:
          result-encoding: string
          script: |
            const { default: verifyStagingRun } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/verify-staging-run.js`
            );
            return verifyStagingRun({ github, context, core });

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download approved artifact
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Install deployment dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: simply-fizzed-prod
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@simply-fizzed-prod.iam.gserviceaccount.com

      - name: Deploy live channel
        run: >-
          npx --no-install firebase deploy --only hosting
          --project simply-fizzed-prod --non-interactive

      - name: Summarize production deployment
        env:
          PRODUCTION_URL: https://simply-fizzed-prod.web.app
        run: |
          {
            echo "## Firebase production deployment"
            echo "- URL: $PRODUCTION_URL"
            echo "- Promoted staging run: ${{ inputs.staging_run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
